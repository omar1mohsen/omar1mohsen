name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:       # run it manually from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#FFC857&color_dots=#163A5F,#1F5A85,#3A82B5,#5FAEDD,#7FD1FF

      - name: Commit snake
        run: |
          mkdir -p assets
          cp dist/snake.svg assets/snake.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg
          git diff --cached --quiet || (git commit -m "Update contribution snake" && git push)
