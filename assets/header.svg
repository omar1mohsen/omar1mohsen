<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Omar Mohsen — senior frontend engineer, now drawing the rest of the system" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#E8F1FF" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minor)"/>
      <path d="M100 0H0V100" fill="none" stroke="#E8F1FF" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M5 0V10" stroke="#FFC857" stroke-width="2"/>
    </marker>
    <style>
      .mono{font-family:'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .ink{stroke:#E8F1FF;fill:none;stroke-width:2.5}
      .draft{stroke:#7FD1FF;fill:none;stroke-width:2.5;stroke-dasharray:10 8}
      .in{animation:in .9s ease-out both}
      .d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}.d4{animation-delay:1.4s}.d5{animation-delay:1.8s}
      @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      .draw{stroke-dasharray:900;animation:draw 1.6s ease-out .3s both}
      @keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
      .packet{fill:#FFC857;offset-rotate:0deg;opacity:0}
      .p1{offset-path:path('M880 165 H960');animation:move 3s linear 2.4s infinite}
      .p2{offset-path:path('M1045 210 V272');animation:move 3s linear 3.9s infinite}
      @keyframes move{0%{offset-distance:0%;opacity:0}10%{opacity:1}45%{offset-distance:100%;opacity:1}50%,100%{offset-distance:100%;opacity:0}}
      @media (prefers-reduced-motion:reduce){.in,.draw{animation:none}.packet{animation:none;opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="460" fill="#0E2A47"/>
  <rect width="1200" height="460" fill="url(#major)"/>
  <rect x="20" y="20" width="1160" height="420" fill="none" stroke="#E8F1FF" stroke-opacity=".45" stroke-width="1.5"/>
  <g stroke="#FFC857" stroke-width="2" fill="none">
    <path d="M20 50V20H50M1150 20H1180V50M1180 410V440H1150M50 440H20V410"/>
  </g>

  <!-- Title -->
  <text class="mono in" x="70" y="104" font-size="18" fill="#FFC857" letter-spacing="1">SHEET 01 / PROFILE</text>
  <text class="sans in d1" x="66" y="198" font-size="78" font-weight="700" fill="#E8F1FF" letter-spacing="-2">Omar Mohsen</text>
  <text class="sans in d2" x="70" y="252" font-size="30" fill="#9EC5E8">Senior frontend engineer.</text>
  <text class="sans in d2" x="70" y="292" font-size="30" fill="#9EC5E8">Now drawing the rest of the system.</text>
  <g class="in d3">
    <path d="M70 345H560" stroke="#FFC857" stroke-width="1.5" marker-start="url(#tick)" marker-end="url(#tick)"/>
    <rect x="200" y="333" width="230" height="24" fill="#0E2A47"/>
    <text class="mono" x="315" y="351" font-size="18" fill="#FFC857" text-anchor="middle">Next.js / React / TS</text>
  </g>
  <text class="mono in d4" x="70" y="398" font-size="16" fill="#7FD1FF" fill-opacity=".8">architecture first, pixels always</text>

  <!-- Diagram: UI (shipped) -->
  <g>
    <rect class="ink draw" x="650" y="90" width="230" height="150"/>
    <path class="ink draw" d="M650 115H880"/>
    <g class="in d2" fill="#7FD1FF">
      <circle cx="665" cy="103" r="4"/><circle cx="679" cy="103" r="4"/><circle cx="693" cy="103" r="4"/>
      <rect x="668" y="132" width="120" height="12" fill-opacity=".55"/>
      <rect x="668" y="154" width="190" height="8" fill-opacity=".25"/>
      <rect x="668" y="170" width="160" height="8" fill-opacity=".25"/>
      <rect x="668" y="196" width="72" height="26" fill="none" stroke="#7FD1FF" stroke-width="2"/>
    </g>
    <text class="mono in d2" x="650" y="266" font-size="18" fill="#E8F1FF">UI / Next.js</text>
  </g>

  <!-- API + data (drafting) -->
  <g class="in d3">
    <path class="draft" d="M880 165H960"/>
    <rect class="draft" x="960" y="120" width="170" height="90"/>
    <text class="mono" x="1045" y="172" font-size="22" fill="#7FD1FF" text-anchor="middle">API</text>
  </g>
  <g class="in d4">
    <path class="draft" d="M1045 210V272"/>
    <ellipse class="draft" cx="1045" cy="290" rx="85" ry="18"/>
    <path class="draft" d="M960 290V370M1130 290V370M960 370A85 18 0 0 0 1130 370"/>
    <text class="mono" x="1045" y="342" font-size="20" fill="#7FD1FF" text-anchor="middle">DATA</text>
  </g>
  <circle class="packet p1" r="6"/>
  <circle class="packet p2" r="6"/>

  <!-- Legend -->
  <g class="in d5 mono" font-size="16">
    <path d="M650 318H690" stroke="#E8F1FF" stroke-width="2.5"/>
    <text x="702" y="323" fill="#E8F1FF">shipped</text>
    <path d="M650 350H690" stroke="#7FD1FF" stroke-width="2.5" stroke-dasharray="10 8"/>
    <text x="702" y="355" fill="#7FD1FF">drafting</text>
  </g>
</svg>
