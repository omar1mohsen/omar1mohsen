<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-label="Omar Mohsen — senior frontend engineer, now drawing the rest of the system" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#E8F1FF" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minor)"/>
      <path d="M100 0H0V100" fill="none" stroke="#E8F1FF" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M5 0V10" stroke="#FFC857" stroke-width="2"/>
    </marker>
    <style>
      .mono{font-family:'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .ink{stroke:#E8F1FF;fill:none;stroke-width:2.5}
      .draft{stroke:#7FD1FF;fill:none;stroke-width:2.5;stroke-dasharray:10 8}
      .in{animation:in .9s ease-out both}
      .d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}.d4{animation-delay:1.4s}.d5{animation-delay:1.8s}
      @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      .draw{stroke-dasharray:1200;animation:draw 1.6s ease-out .3s both}
      @keyframes draw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
      .packet{fill:#FFC857;offset-rotate:0deg;opacity:0}
      .p1{offset-path:path('M370 485 H420');animation:move 3s linear 2.4s infinite}
      .p2{offset-path:path('M495 530 V580');animation:move 3s linear 3.9s infinite}
      @keyframes move{0%{offset-distance:0%;opacity:0}10%{opacity:1}45%{offset-distance:100%;opacity:1}50%,100%{offset-distance:100%;opacity:0}}
      @media (prefers-reduced-motion:reduce){.in,.draw{animation:none}.packet{animation:none;opacity:0}}
    </style>
  </defs>

  
  <rect width="600" height="760" fill="#0E2A47"/>
  <rect width="600" height="760" fill="url(#major)"/>
  <rect x="16" y="16" width="568" height="728" fill="none" stroke="#E8F1FF" stroke-opacity=".45" stroke-width="1.5"/>
  <g stroke="#FFC857" stroke-width="2" fill="none"><path d="M16 46V16H46M554 16H584V46M584 714V744H554M46 744H16V714"/></g>

  <text class="mono in" x="48" y="90" font-size="20" fill="#FFC857" letter-spacing="1">SHEET 01 / PROFILE</text>
  <text class="sans in d1" x="45" y="170" font-size="72" font-weight="700" fill="#E8F1FF" letter-spacing="-2">Omar Mohsen</text>
  <text class="sans in d2" x="48" y="225" font-size="30" fill="#9EC5E8">Senior frontend engineer.</text>
  <text class="sans in d2" x="48" y="265" font-size="30" fill="#9EC5E8">Now drawing the rest</text>
  <text class="sans in d2" x="48" y="305" font-size="30" fill="#9EC5E8">of the system.</text>
  <g class="in d3">
    <path d="M48 360H552" stroke="#FFC857" stroke-width="1.5" marker-start="url(#tick)" marker-end="url(#tick)"/>
    <rect x="160" y="346" width="280" height="28" fill="#0E2A47"/>
    <text class="mono" x="300" y="367" font-size="21" fill="#FFC857" text-anchor="middle">Next.js / React / TS</text>
  </g>

  <rect class="ink draw" x="48" y="420" width="322" height="200"/>
  <path class="ink draw" d="M48 450H370"/>
  <g class="in d2" fill="#7FD1FF">
    <circle cx="66" cy="435" r="5"/><circle cx="84" cy="435" r="5"/><circle cx="102" cy="435" r="5"/>
    <rect x="70" y="475" width="160" height="16" fill-opacity=".55"/>
    <rect x="70" y="505" width="270" height="10" fill-opacity=".25"/>
    <rect x="70" y="525" width="220" height="10" fill-opacity=".25"/>
    <rect x="70" y="560" width="96" height="34" fill="none" stroke="#7FD1FF" stroke-width="2"/>
  </g>
  <text class="mono in d2" x="48" y="652" font-size="21" fill="#E8F1FF">UI / Next.js</text>

  <g class="in d3">
    <path class="draft" d="M370 485H420"/>
    <rect class="draft" x="420" y="440" width="150" height="90"/>
    <text class="mono" x="495" y="493" font-size="24" fill="#7FD1FF" text-anchor="middle">API</text>
  </g>
  <g class="in d4">
    <path class="draft" d="M495 530V580"/>
    <ellipse class="draft" cx="495" cy="596" rx="75" ry="16"/>
    <path class="draft" d="M420 596V660M570 596V660M420 660A75 16 0 0 0 570 660"/>
    <text class="mono" x="495" y="640" font-size="22" fill="#7FD1FF" text-anchor="middle">DATA</text>
  </g>
  <circle class="packet p1" r="7"/>
  <circle class="packet p2" r="7"/>

  <g class="in d5 mono" font-size="19">
    <path d="M48 705H88" stroke="#E8F1FF" stroke-width="2.5"/><text x="100" y="711" fill="#E8F1FF">shipped</text>
    <path d="M230 705H270" stroke="#7FD1FF" stroke-width="2.5" stroke-dasharray="10 8"/><text x="282" y="711" fill="#7FD1FF">drafting</text>
  </g>
</svg>
